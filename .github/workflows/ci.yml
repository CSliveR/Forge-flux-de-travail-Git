name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check && ruff format --check # ruff check et ruff format --check
      - run: pre-commit run --all-files
      - run: pytest -q --cov=app --cov-report=xml --cov-report=html # pytest
      - uses: actions/upload-artifact@v4
        with :
          # https://github.com/actions/upload-artifact#inputs
          name: coverage-report
          path: htmlcov/
          retention-days: 7
